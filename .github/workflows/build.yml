name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---- built-in on-device AI: llama.cpp's llama-server, compiled for Android arm64 ----
      - name: Latest llama.cpp release
        id: llama
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      - name: Cache llama-server
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama-bin
          key: llama-server-android-arm64-v2-${{ steps.llama.outputs.tag }}

      - name: Build llama-server for Android
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK  llama.cpp: ${{ steps.llama.outputs.tag }}"
          git clone --depth 1 --branch "${{ steps.llama.outputs.tag }}" https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build llama-build --target llama-server -j 4
          mkdir -p llama-bin
          cp "$(find llama-build -type f -name llama-server | head -n 1)" llama-bin/llama-server
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" llama-bin/llama-server
          ls -la llama-bin

      - name: Bundle llama-server into the APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp llama-bin/llama-server app/src/main/jniLibs/arm64-v8a/libllamaserver.so

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/alfa.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/alfa.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk alfa-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alfa-launcher
          path: alfa-launcher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ALFA Launcher v1.0.${{ github.run_number }}
          files: alfa-launcher.apk
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Install `alfa-launcher.apk`, or update from inside the launcher: IT Tools → App update.
